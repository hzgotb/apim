name: Publish / npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve publish ref
        id: publish-ref
        run: |
          REF="${{ inputs.tag }}"
          if [ -z "$REF" ]; then
            REF="${GITHUB_REF_NAME}"
          fi
          echo "value=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.publish-ref.outputs.value }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: |
          VERSION="${{ steps.publish-ref.outputs.value }}"
          VERSION="${VERSION#v}"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          test "$(node -p "require('./packages/cli/package.json').version")" = "$VERSION"
          test "$(node -p "require('./packages/nuxt/package.json').version")" = "$VERSION"

      - name: Run checks
        run: pnpm build && pnpm test && pnpm test:types && pnpm test:consumers

      - name: Check published versions
        id: published
        run: |
          VERSION="${{ steps.publish-ref.outputs.value }}"
          VERSION="${VERSION#v}"
          if npm view "@hzgotb/apim-cli@$VERSION" version >/dev/null 2>&1; then
            echo "cli=true" >> "$GITHUB_OUTPUT"
          else
            echo "cli=false" >> "$GITHUB_OUTPUT"
          fi
          if npm view "@hzgotb/apim-nuxt@$VERSION" version >/dev/null 2>&1; then
            echo "nuxt=true" >> "$GITHUB_OUTPUT"
          else
            echo "nuxt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish CLI package
        if: steps.published.outputs.cli != 'true'
        run: |
          pnpm --dir packages/cli pack --pack-destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP"/hzgotb-apim-cli-*.tgz --access public --provenance

      - name: Publish Nuxt package
        if: steps.published.outputs.nuxt != 'true'
        run: |
          pnpm --dir packages/nuxt pack --pack-destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP"/hzgotb-apim-nuxt-*.tgz --access public --provenance
